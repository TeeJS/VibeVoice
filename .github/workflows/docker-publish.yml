name: build-and-push

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # CUDA base + deps are large; reclaim runner space before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: |
            ghcr.io/teejs/vibevoice:latest
            ghcr.io/teejs/vibevoice:7b
          # Unraid's update check rejects bare OCI manifests. oci-mediatypes=false
          # emits a docker v2 manifest it can read; attestations off keep it clean.
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
